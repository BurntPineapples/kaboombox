<text x="46" y="728" font-size="15" fill="#1d2329" text-anchor="start" font-weight="bold">Power</text>
<text x="46" y="752" font-size="13" fill="#1d2329" text-anchor="start" font-weight="normal">4× AA pack (+) → POWER toggle → ESP32 5V pin and LCD VCC.   4× AA pack (−) → GND.</text>
<text x="46" y="774" font-size="13" fill="#1d2329" text-anchor="start" font-weight="normal">ESP32 3V3 → key switch common and the four 10k pull-ups (buttons 5-8: GPIO 34, 35, 36, 39 have no internal pull-up).</text>
<text x="46" y="796" font-size="13" fill="#1d2329" text-anchor="start" font-weight="normal">Every button's other leg, every LED's − leg and LCD GND go to a shared GND rail. NiMH AAs (4.8 V) are kinder to the LCD than fresh alkalines.</text>
<line x1="30" y1="874" x2="56" y2="874" stroke="#2563eb" stroke-width="3"/>
<text x="64" y="878" font-size="12" fill="#5b6670" text-anchor="start" font-weight="normal">signal wire to an ESP32 GPIO</text>
<text x="1010" y="880" font-size="12" fill="#5b6670" text-anchor="end" font-weight="normal">Default LCD I2C address 0x27 (some backpacks are 0x3F).</text>
