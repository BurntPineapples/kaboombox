<text x="202" y="682" font-size="12" fill="#d42a2a" text-anchor="end" font-weight="bold">5V / VIN</text>
<text x="340" y="682" font-size="12" fill="#1d2329" text-anchor="start" font-weight="bold">VCC</text>
<text x="270.0" y="704" font-size="11" fill="#5b6670" text-anchor="middle" font-weight="normal">power header</text>
<rect x="30" y="750" width="1060" height="96" rx="6" fill="#f8fafc" stroke="#5b6670" stroke-width="1.5"/>
<text x="46" y="774" font-size="15" fill="#1d2329" text-anchor="start" font-weight="bold">Notes</text>
<text x="46" y="796" font-size="13" fill="#1d2329" text-anchor="start" font-weight="normal">The 12 V + is fused, then daisy-chained screw to screw across COM1-COM8. Each NO goes to clip A; clip B of every channel returns to the NEG Wago bus.</text>
<text x="46" y="816" font-size="13" fill="#1d2329" text-anchor="start" font-weight="normal">The fuse is the master safety: pull it and the firing circuit is dead whatever the software does. The ESP32 is USB-powered; its 5V/VIN feeds the relay module VCC.</text>
<text x="46" y="836" font-size="13" fill="#1d2329" text-anchor="start" font-weight="normal">Continuity: an igniter on a channel pulls its sense pin LOW through the 10k series resistor, which also protects the pin from 12 V while the relay fires.</text>
<line x1="30" y1="860" x2="56" y2="860" stroke="#2563eb" stroke-width="3"/>
<text x="64" y="864" font-size="12" fill="#5b6670" text-anchor="start" font-weight="normal">signal</text>
<line x1="30" y1="878" x2="56" y2="878" stroke="#d42a2a" stroke-width="3"/>
<text x="64" y="882" font-size="12" fill="#5b6670" text-anchor="start" font-weight="normal">+12 V / +5 V</text>
<line x1="250" y1="860" x2="276" y2="860" stroke="#1d2329" stroke-width="3"/>
<text x="284" y="864" font-size="12" fill="#5b6670" text-anchor="start" font-weight="normal">return / GND</text>
<line x1="250" y1="878" x2="276" y2="878" stroke="#d97706" stroke-width="3"/>
<text x="284" y="882" font-size="12" fill="#5b6670" text-anchor="start" font-weight="normal">continuity sense</text>
<circle cx="490" cy="860" r="4" fill="#d42a2a"/>
<text x="502" y="864" font-size="12" fill="#5b6670" text-anchor="start" font-weight="normal">dot = wires joined; wires that cross without a dot are not connected</text>
</svg>
