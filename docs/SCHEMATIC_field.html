<text x="42" y="1076" font-family="Arial" font-size="9" font-weight="normal" fill="#444" text-anchor="start">1.  Two isolated supplies: 5V logic (USB) and 12V firing (SLA). Shared ground at NEG bus only.</text>

<text x="42" y="1108" font-family="Arial" font-size="9" font-weight="normal" fill="#444" text-anchor="start">3.  10k series also protects the GPIO from 12V present on NO during a fire pulse.</text>
<text x="42" y="1124" font-family="Arial" font-size="9" font-weight="normal" fill="#444" text-anchor="start">4.  Relay contacts rated 10A/250VAC. Fuse F1 = 10-15A slow. Fuse OUT until show time.</text>
